# .azure-pipelines/templates/stage-plan.yml
parameters:
  - name: workingDirectory
    type: string
  - name: serviceConnection
    type: string
  - name: copyWorkloadFiles
    type: boolean
    default: false
  - name: enableArtifact
    type: boolean
    default: false

stages:
  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Prepare
    jobs:
      - job: TerraformPlan
        displayName: Plan
        steps:
          - ${{ if eq(parameters.copyWorkloadFiles, true) }}:
            - task: DownloadPipelineArtifact@2
              displayName: 'Downloading workload files (init.tf and terraform.tfvars)'
              inputs:
                buildType: current
                artifact: workload-$(Build.BuildId)
                path: ${{ parameters.workingDirectory }}

          - bash: |
              export BINDIR=~/bin
              mkdir -p $BINDIR
              curl -L https://raw.githubusercontent.com/warrensbox/terraform-switcher/release/install.sh | bash
            displayName: 'Installing tfswitch'

          - bash: $HOME/bin/tfswitch -b $HOME/bin/terraform
            displayName: 'Setting Terraform Version'
            workingDirectory: ${{ parameters.workingDirectory }}

          - task: AzureCLI@2
            name: terraformPlan
            displayName: 'REVIEW terraform plan'
            env:
              AZDO_PERSONAL_ACCESS_TOKEN: $(System.AccessToken)
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: ${{ parameters.workingDirectory }}
              inlineScript: |
                
                echo "##vso[task.setvariable variable=copyArtifact]false"
                echo "##vso[task.setvariable variable=skipApproval;isOutput=true]true"

                $HOME/bin/terraform init
                $HOME/bin/terraform plan -detailed-exitcode -out=planfile
                exitcode=${PIPESTATUS[0]}
                if [ "$exitcode" -eq 0 ]; then
                  echo "No changes detected in terraform plan."
                elif [ "$exitcode" -eq 2 ]; then
                  echo "##vso[task.setvariable variable=skipApproval;isOutput=true]false"
                  echo "##vso[task.setvariable variable=copyArtifact]true"
                  echo "Changes detected in terraform plan."
                  echo "Installing tf-summarize via go..."
                  go install github.com/dineshba/tf-summarize@latest >/dev/null 2>&1

                  $HOME/bin/terraform show -json planfile | $HOME/go/bin/tf-summarize
                  $HOME/bin/terraform show -json planfile | $HOME/go/bin/tf-summarize -tree
                else
                  echo "Terraform plan failed!"
                  exit $exitcode
                fi

          - ${{ if eq(parameters.enableArtifact, true) }}:
            - task: CopyFiles@2
              displayName: 'Copying plan file'
              condition: and(succeeded(), eq(variables['copyArtifact'], 'true'))
              inputs:
                sourceFolder: ${{ parameters.workingDirectory }}
                contents: 'planfile'
                targetFolder: $(Build.ArtifactStagingDirectory)

            - publish: '$(Build.ArtifactStagingDirectory)/planfile'
              displayName: 'Publishing plan file'
              condition: and(succeeded(), eq(variables['copyArtifact'], 'true'))
              artifact: tfPlan-$(Build.BuildId)
